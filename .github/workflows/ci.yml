name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup update stable && rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check markdown links
        run: npx -y markdown-link-check -q README.md SECURITY.md docs/architecture.md docs/integrations.md docs/mainnet.md docs/security-threat-model.md
      - name: Spell check markdown files
        run: npx -y cspell --config .cspellrc.json "**/.md"
      - run: cargo build --release --target wasm32-unknown-unknown -p tributary-splitter
      - name: Measure contract size
        run: |
          wasm_path="target/wasm32-unknown-unknown/release/tributary_splitter.wasm"
          if [ -f "${wasm_path}" ]; then
            size_bytes=$(wc -c < "${wasm_path}" | xargs)
            size_kb=$(awk -v bytes="$size_bytes" 'BEGIN {printf "%.2f", bytes/1024}')
            {
              echo "## Contract size: tributary-splitter"
              echo ""
              echo "| Metric | Value |"
              echo "| ----- | ------|"
              echo "| Size (bytes) | $size_bytes |"
              echo "| Size (KiB) | ${size_kb} KiB |"
            } > contract-size.md
            cat contract-size.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Wasm file not found!"
            exit 1
          fi
