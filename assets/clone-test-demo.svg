<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17233a"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="260" rx="16" fill="url(#bg-grad)" stroke="#1f2c45" stroke-width="1.5"/>

  <!-- Step 1: Clone -->
  <g transform="translate(30, 30)">
    <rect width="230" height="200" rx="12" fill="url(#card-grad)" stroke="#1f2c45" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="18" fill="rgba(76, 195, 255, 0.12)" stroke="#4cc3ff" stroke-width="1.5"/>
    <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#4cc3ff" text-anchor="middle">1</text>
    <text x="72" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e8eefb">Clone</text>

    <!-- Code Block -->
    <rect x="20" y="75" width="190" height="65" rx="8" fill="#0b1220" stroke="#1f2c45"/>
    <text x="32" y="100" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#4cc3ff">git clone</text>
    <text x="32" y="120" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#b8c5d9">.../tributary.git</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b8c5d9">Fetch repo &amp; toolchain</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(268, 120)">
    <path d="M 0 10 L 28 10" stroke="#4cc3ff" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="34,10 26,5 26,15" fill="#4cc3ff"/>
  </g>

  <!-- Step 2: Test -->
  <g transform="translate(305, 30)">
    <rect width="230" height="200" rx="12" fill="url(#card-grad)" stroke="#1f2c45" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="18" fill="rgba(76, 195, 255, 0.12)" stroke="#4cc3ff" stroke-width="1.5"/>
    <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#4cc3ff" text-anchor="middle">2</text>
    <text x="72" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e8eefb">Test</text>

    <!-- Code Block -->
    <rect x="20" y="75" width="190" height="65" rx="8" fill="#0b1220" stroke="#1f2c45"/>
    <text x="32" y="100" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#4cc3ff">cargo test</text>
    <text x="32" y="120" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#4ade80">✓ 57 passed</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b8c5d9">Run Rust contract suite</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(543, 120)">
    <path d="M 0 10 L 28 10" stroke="#4cc3ff" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="34,10 26,5 26,15" fill="#4cc3ff"/>
  </g>

  <!-- Step 3: Demo -->
  <g transform="translate(580, 30)">
    <rect width="230" height="200" rx="12" fill="url(#card-grad)" stroke="#1f2c45" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="18" fill="rgba(76, 195, 255, 0.12)" stroke="#4cc3ff" stroke-width="1.5"/>
    <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#4cc3ff" text-anchor="middle">3</text>
    <text x="72" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e8eefb">Demo</text>

    <!-- Code Block -->
    <rect x="20" y="75" width="190" height="65" rx="8" fill="#0b1220" stroke="#1f2c45"/>
    <text x="32" y="100" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#4cc3ff">sh ./scripts/demo.sh</text>
    <text x="32" y="120" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#b8c5d9">create &amp; pay on testnet</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b8c5d9">Run end-to-end flow</text>
  </g>
</svg>
